<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fc" />
    <meta name="description" content="Angelo Averion — game developer and IT student building Unity experiences and practical software." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Angelo Averion Portfolio</title>
    <script>
      try {
        const saved = localStorage.getItem('angelo-theme');
        const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
